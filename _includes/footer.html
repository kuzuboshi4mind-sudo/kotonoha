<footer class="site-footer">
  <ul class="site-footer__links">
    {% for l in site.links %}{% if l.url != "" %}
    <li><a href="{{ l.url }}" rel="noopener" target="_blank">{{ l.name }}</a></li>
    {% endif %}{% endfor %}
    <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
  </ul>
  <p class="site-footer__copy">© {{ site.time | date: "%Y" }} {{ site.author }}<br><small>掲載作品の無断転載はご遠慮ください。</small></p>
</footer>
