<li class="gallery-item">
  <a href="{{ include.post.url | relative_url }}">
    <figure>
      <img src="{{ include.post.image | relative_url }}" alt="{{ include.post.title }}" loading="lazy">
      <figcaption>{{ include.post.title }}<time>{{ include.post.date | date: "%Y.%m.%d" }}</time></figcaption>
    </figure>
  </a>
</li>
