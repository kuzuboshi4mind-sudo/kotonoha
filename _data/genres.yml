# ============================================================
#  ジャンルの一覧
#  - slug     : 英数字の識別子（作品ファイルの genre: に書く値）
#  - name     : 画面に出るジャンル名
#  - en       : 英語の小見出し
#  - vertical : true にすると、そのジャンルの作品は縦書きで表示
#  - gallery  : true にすると、一覧が画像のギャラリー表示になる
#
#  ジャンルを増やすときは、ここに追記し、
#  genres/ フォルダに同じ形のページを1つ追加してください（README参照）
#  並び順はそのままメニューの順番になります。
# ============================================================

- slug: poem
